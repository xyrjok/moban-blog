<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { max-width: 400px; margin: 100px auto; border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .admin-container { max-width: 900px; margin: 40px auto; display: none; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-header { background-color: #fff; border-bottom: 1px solid #eee; font-weight: 600; border-radius: 12px 12px 0 0 !important; padding: 15px 20px; }
        .btn-primary { background-color: #4e73df; border: none; }
        .btn-primary:hover { background-color: #2e59d9; }
        .nav-pills .nav-link.active { background-color: #4e73df; }
        .nav-pills .nav-link { color: #555; font-weight: 500; }
        textarea { resize: vertical; }
        #preview-img { max-height: 200px; border-radius: 8px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div id="login-section" class="container">
        <div class="card login-card p-4">
            <div class="text-center mb-4">
                <h4>管理员登录</h4>
                <p class="text-muted">请输入您的凭证</p>
            </div>
            <div class="mb-3">
                <input type="text" id="username" class="form-control form-control-lg" placeholder="用户名">
            </div>
            <div class="mb-4">
                <input type="password" id="password" class="form-control form-control-lg" placeholder="密码">
            </div>
            <button onclick="login()" class="btn btn-primary w-100 btn-lg">进入后台</button>
        </div>
    </div>

    <div id="admin-section" class="admin-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>博客控制台</h3>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">退出登录</button>
        </div>

        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body p-2">
                        <div class="nav flex-column nav-pills" role="tablist">
                            <button class="nav-link active text-start py-3 px-4" data-bs-toggle="pill" data-bs-target="#tab-write">
                                ✏️ 写文章
                            </button>
                            <button class="nav-link text-start py-3 px-4" data-bs-toggle="pill" data-bs-target="#tab-settings">
                                ⚙️ 设置
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="tab-write">
                        <div class="card">
                            <div class="card-header">发布新文章</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">文章标题</label>
                                    <input type="text" id="p-title" class="form-control" placeholder="请输入引人注目的标题">
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">文章分类</label>
                                        <input type="text" id="p-category" class="form-control" placeholder="例如: 技术, 生活, 随笔">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">封面图片</label>
                                        <input type="file" id="p-file" class="form-control">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <img id="preview-img" src="" alt="预览">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">文章内容 (支持 HTML)</label>
                                    <textarea id="p-content" class="form-control" rows="12" placeholder="在此输入内容..."></textarea>
                                </div>
                                <div class="text-end">
                                    <button onclick="publish()" id="btn-pub" class="btn btn-success px-4">发布文章</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="tab-settings">
                        <div class="card">
                            <div class="card-header">GitHub 图床配置</div>
                            <div class="card-body">
                                <div class="alert alert-info small">需要配置 GitHub Token 才能上传图片。</div>
                                <div class="mb-3">
                                    <label class="form-label">GitHub 用户名</label>
                                    <input type="text" id="c-user" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">仓库名称 (Repo)</label>
                                    <input type="text" id="c-repo" class="form-control" placeholder="例如: blog-images">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Access Token</label>
                                    <input type="password" id="c-token" class="form-control">
                                </div>
                                <button onclick="saveConfig()" class="btn btn-primary">保存配置</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 检查登录状态
        if(localStorage.getItem('is_admin')) {
            showAdmin();
        }

        function showAdmin() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-section').style.display = 'block';
        }

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('is_admin', 'true');
                showAdmin();
            } else {
                alert('账号或密码错误');
            }
        }

        function logout() {
            localStorage.removeItem('is_admin');
            location.reload();
        }

        async function saveConfig() {
            const data = {
                gh_user: document.getElementById('c-user').value,
                gh_repo: document.getElementById('c-repo').value,
                gh_token: document.getElementById('c-token').value
            };
            await fetch('/api/config', { method: 'POST', body: JSON.stringify(data) });
            alert('配置已保存');
        }

        async function publish() {
            const btn = document.getElementById('btn-pub');
            btn.disabled = true;
            btn.innerText = "正在发布...";
            
            const fileInput = document.getElementById('p-file');
            let imgUrl = '';

            try {
                // 1. 上传图片
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    
                    await new Promise((resolve) => {
                        reader.onload = async () => {
                            const base64 = reader.result.split(',')[1];
                            const res = await fetch('/api/upload', {
                                method: 'POST',
                                body: JSON.stringify({ fileName: file.name, content: base64 })
                            });
                            const data = await res.json();
                            imgUrl = data.url || '';
                            resolve();
                        };
                        reader.readAsDataURL(file);
                    });
                }

                // 2. 提交文章
                const postData = {
                    title: document.getElementById('p-title').value,
                    category: document.getElementById('p-category').value,
                    content: document.getElementById('p-content').value,
                    image: imgUrl
                };
                
                if(!postData.title) throw new Error("标题不能为空");

                await fetch('/api/post', {
                    method: 'POST',
                    body: JSON.stringify(postData)
                });
                
                alert('🎉 发布成功！');
                location.reload(); // 刷新清空
            } catch (e) {
                alert('发布失败: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "发布文章";
            }
        }
    </script>
</body>
</html>
